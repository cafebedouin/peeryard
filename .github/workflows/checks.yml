# The no-node checks, on every push and pull request: seconds, no node, no JDK 8. The node runs are sweep.yml and aa.yml.
# Hand-maintained (the development repository runs the same steps under its own checks workflow); keep the step list
# equal to CONTRIBUTING.md's "Before a pull request".
name: checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  no-node:
    name: no-node tests, lint, leak check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq jq shellcheck
      - name: shellcheck (scripts, then the sourced hooks)
        run: |
          # the file list is NUL-separated (a path with a space stays one word); an empty list is a broken check, not a pass
          mapfile -d '' files < <(grep -rlZE --exclude-dir=.git '^#!.*bash' --include='*.sh' --include='comment-lint' .)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no bash scripts found to shellcheck"; exit 1; }
          echo "shellcheck: ${#files[@]} scripts"
          shellcheck -x "${files[@]}"
          shellcheck -s bash -e SC2148,SC2154 rig/examples/*.sh rig/lib/*.sh diffrun/scenarios/precheck/lib.sh diffrun/scenarios/lib/rig-scenario.sh diffrun/scenarios/hooks/*.sh
      - name: bash -n
        run: |
          mapfile -d '' files < <(grep -rlZE --exclude-dir=.git '^#!.*bash' .)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no bash scripts found for bash -n"; exit 1; }
          echo "bash -n: ${#files[@]} files"
          for f in "${files[@]}"; do bash -n "$f"; done
      - name: python tests (diagnose, features, sweep, logmap, aa_pool)
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: leakcheck (no register files or ids travel with peeryard)
        run: bash tests/leakcheck.sh
      - name: lint
        run: T=$(mktemp -d) bash tests/lint.sh
      - name: precheck
        run: T=$(mktemp -d) bash tests/precheck.sh
      - name: sequential rule
        run: T=$(mktemp -d) bash tests/sequential.sh
      - name: scenario phases (rig/lib/phases.sh and the hooks that use it)
        run: T=$(mktemp -d) bash tests/phases.sh
      - name: indexer-diff comparator (rig/indexer-cmp.sh on fixture snapshots)
        run: T=$(mktemp -d) bash tests/indexer_diff.sh
      - name: crash-consistency classifier (rig/crash-verdict.sh on fixture observations)
        run: T=$(mktemp -d) bash tests/crash_consistency.sh
      - name: wallet-oracle comparator (rig/lib/wallet_oracle.sh on fixture snapshots)
        run: T=$(mktemp -d) bash tests/wallet_oracle.sh
      - name: wallet-workload invariants (rig/wallet-check.sh on fixture observations)
        run: T=$(mktemp -d) bash tests/wallet_workload.sh
      - name: PR path (review/pr-line.sh on a fixture history; the rig-example scenario on a stub rig)
        run: T=$(mktemp -d) bash tests/pr_path.sh
      - name: rig checks (topology validation, partition/heal flags, settle, the helper registry, hook env and verdict rules)
        run: T=$(mktemp -d) bash tests/rig_checks.sh
      - name: tooling (check.sh, stack.sh, register.sh, provenance.sh, post.sh)
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          T=$(mktemp -d) bash tests/tooling.sh
      - name: exported workflows in step with their source (no-op in a standalone clone)
        run: bash ci/export-workflows.sh --check
      - name: the size table in docs/workflows.md in step with the workflows (ci/workflow-sizes.py)
        run: python3 ci/workflow-sizes.py --check
