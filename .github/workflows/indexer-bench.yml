# Rebuild rate of ergo's extra indexer (extraIndex) from an empty index, per ergo ref, on one GitHub-hosted runner, so
# the arms share a host and a release note can quote a number anyone can re-run. Each arm is an ergo ref with
# bench/indexer/ExtraIndexerRebuildRateSpec.scala copied next to ExtraIndexerSpecification: it generates a chain of
# `blocks` blocks with the spec's own generator (about 10 one-in/one-out transactions a block; token minting limited to
# blocks 1-3, see below) and times only the
# indexing (empty index -> caught up, buffer written), with the production saveLimit and segmentThreshold. The arms run
# interleaved, `rounds` times, the order reversed every other round. A generated chain is held in the page cache:
# the rate is a CPU-and-write floor of a rebuild, not a disk-bound mainnet rate. Runs by hand, or on a push to
# ci/indexer-bench with the PUSH_* values below (a new workflow can be dispatched only once it is on the default branch).
name: peeryard indexer bench
run-name: "indexer bench: ${{ inputs.arms || 'push defaults' }} x${{ inputs.rounds }} (${{ inputs.blocks }} blocks)"
on:
  push:
    branches: [ 'ci/indexer-bench' ]
  workflow_dispatch:
    inputs:
      arms: { description: 'space-separated label=ref (an ergoplatform/ergo branch, tag, sha, or pull/N/head)', default: 'v609=v6.0.9 pr2717=pull/2717/head' }
      blocks: { description: 'generated chain length (1-4800: the generator keeps headers inside a 5000-minute window)', default: '4800' }
      rounds: { description: 'rounds; each runs every arm once (1-5)', default: '3' }
permissions:
  contents: read
jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PUSH_ARMS: 'v609=2675ebfab12f498ef5380785eeb9bdad35afb184 pr2717=0fdc6e7d91cc37fb5d07e2044b8f4f90247744fa'
      PUSH_BLOCKS: '4800'
      PUSH_ROUNDS: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: sbt/setup-sbt@v1
      - name: Cache the sbt dependencies (the ergo build files are not in this checkout)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: indexer-bench-sbt-${{ hashFiles('.github/workflows/indexer-bench.yml') }}
          restore-keys: indexer-bench-sbt-
      - name: Check the inputs
        env: { IN_ARMS: '${{ inputs.arms }}', IN_BLOCKS: '${{ inputs.blocks }}', IN_ROUNDS: '${{ inputs.rounds }}' }
        run: |
          ARMS="${IN_ARMS:-$PUSH_ARMS}"; BLOCKS="${IN_BLOCKS:-$PUSH_BLOCKS}"; ROUNDS="${IN_ROUNDS:-$PUSH_ROUNDS}"
          [[ "$ROUNDS" =~ ^[1-5]$ ]] || { echo "rounds: 1-5"; exit 1; }
          [[ "$BLOCKS" =~ ^[0-9]+$ ]] && (( BLOCKS >= 1 && BLOCKS <= 4800 )) || { echo "blocks: 1-4800"; exit 1; }
          for a in $ARMS; do [[ "$a" =~ ^[a-z0-9]+=[A-Za-z0-9/._-]+$ ]] || { echo "arm: $a is not label=ref"; exit 1; }; done
          printf 'ARMS=%s\nBLOCKS=%s\nROUNDS=%s\n' "$ARMS" "$BLOCKS" "$ROUNDS" | tee -a "$GITHUB_ENV"
      - name: ergo trees, one per arm, with the bench spec
        run: |
          git clone -q --filter=blob:none https://github.com/ergoplatform/ergo "$HOME/ergo-clone"
          mkdir -p out; : > out/arms.txt
          for a in $ARMS; do label="${a%%=*}"; ref="${a#*=}"
            git -C "$HOME/ergo-clone" fetch -q origin "$ref"; sha="$(git -C "$HOME/ergo-clone" rev-parse FETCH_HEAD)"
            git -C "$HOME/ergo-clone" worktree add -q --detach "$HOME/arm-$label" "$sha"
            x="$HOME/arm-$label/src/test/scala/org/ergoplatform/nodeView/history/extra"
            cp bench/indexer/ExtraIndexerRebuildRateSpec.scala "$x/"
            # the generator mints a token in every block and carries all of them in one box, which passes the 4096-byte
            # box limit near block 100; mint only in blocks 1-3 (three tokens carried), the same edit on every arm
            sed -i 's/moveTokens(inOpt, i == 0)))/moveTokens(inOpt, i == 0 \&\& height <= 3)))/' "$x/ChainGenerator.scala"
            grep -q 'i == 0 && height <= 3' "$x/ChainGenerator.scala" || { echo "$label: generator edit did not apply"; exit 1; }
            echo "$label $ref $sha" | tee -a out/arms.txt; done
          sha256sum bench/indexer/ExtraIndexerRebuildRateSpec.scala | tee -a out/arms.txt
          { uname -r; nproc; free -m | head -2; java -version 2>&1 | head -1; } | tee out/host.txt
      - name: Compile each arm (not timed)
        run: |
          export XDG_RUNTIME_DIR="/tmp/sr-$(id -u)"; mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
          for a in $ARMS; do label="${a%%=*}"
            (cd "$HOME/arm-$label" && sbt -batch Test/compile > "$GITHUB_WORKSPACE/out/compile-$label.log" 2>&1) \
              || { tail -50 "out/compile-$label.log"; exit 1; }; echo "compiled $label"; done
      - name: Run the arms interleaved
        run: |
          export XDG_RUNTIME_DIR="/tmp/sr-$(id -u)" BENCH_BLOCKS="$BLOCKS"
          read -ra arms <<< "$ARMS"; printf 'round\tarm\tresult\n' > out/results.tsv
          for r in $(seq 1 "$ROUNDS"); do
            order=("${arms[@]}"); (( r % 2 == 0 )) && order=($(printf '%s\n' "${arms[@]}" | tac))
            for a in "${order[@]}"; do label="${a%%=*}"; log="$GITHUB_WORKSPACE/out/run-$r-$label.log"
              (cd "$HOME/arm-$label" && sbt -batch "testOnly *ExtraIndexerRebuildRateSpec -- -z PEERYARD-BENCH" > "$log" 2>&1) \
                || echo "sbt exit $? ($label round $r)"
              line="$(grep -o 'PEERYARD-BENCH schema=.*' "$log" | head -1)"; printf '%s\t%s\t%s\n' "$r" "$label" "${line:-NO RESULT}" >> out/results.tsv
              grep -h -E '(Tests: |\*\*\* FAILED)' "$log" | head -3 || true
            done; done
          { echo '```'; cat out/arms.txt out/host.txt out/results.tsv; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          for f in out/run-*.log; do gzip "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: indexer-bench, path: out/, retention-days: 90 }
