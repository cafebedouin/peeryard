# Bursts of ordinary wallet payments on the Matrix line (rig/examples/matrix-paychain), before and after
# ergoplatform/ergo#2504, on GitHub-hosted runners. Two builds of the weak-blocks line: the base commit peeryard carries
# (patches/ergo-matrix/patches.json) and the same base plus #2504's production diff (src/main, ergo-core/src/main) at a
# pinned head. Each is run REPEATS times; diag/matrix_paychain.py counts, per run, the payments that spend an earlier
# payment's unconfirmed change (dependent) and the accepted payments that end neither confirmed nor in the miner's
# pool (lost). Runs by hand.
name: peeryard matrix paychain
on:
  workflow_dispatch:
    inputs:
      pr_head: { description: 'ergoplatform/ergo#2504 head commit to build', default: 'c6ff5d5c2f5b61085b0ad99be44f5bcf75ad92c9' }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: sbt/setup-sbt@v1
      - name: Cache the built jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/diffrun/builds
          key: peeryard-matrix-paychain-${{ inputs.pr_head }}-${{ hashFiles('patches/ergo-matrix/patches.json', 'diffrun/build.sh') }}
      - name: ergo clone (the weak-blocks commit and #2504 at the pinned head)
        run: |
          git clone -q --filter=blob:none https://github.com/ergoplatform/ergo "$HOME/ergo-clone"
          git -C "$HOME/ergo-clone" fetch -q origin weak-blocks pull/2504/head:pr-2504
          git -C "$HOME/ergo-clone" cat-file -e "$(jq -r .base patches/ergo-matrix/patches.json)^{commit}"
          head="$(git -C "$HOME/ergo-clone" rev-parse pr-2504)"
          [ "$head" = "${{ inputs.pr_head }}" ] || { echo "#2504 head is $head, expected ${{ inputs.pr_head }}: re-dispatch with pr_head=$head after reading the change"; exit 1; }
      - name: Cache the sigma-state snapshot the weak-blocks line depends on
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.scorexfoundation
          key: sigma-snapshot-${{ hashFiles('patches/ergo-matrix/patches.json', 'patches/sigma-snapshot.sh') }}
      - name: sigma-state snapshot (weak-blocks pins a -SNAPSHOT that is on no public repository)
        run: |
          export DIFFRUN_ERGO_CLONE="$HOME/ergo-clone" JAVA8_HOME="$JAVA_HOME"
          bash patches/sigma-snapshot.sh "$(jq -r .base patches/ergo-matrix/patches.json)"
      - name: Build the base and the base + #2504
        run: |
          export DIFFRUN_ERGO_CLONE="$HOME/ergo-clone" JAVA8_HOME="$JAVA_HOME" DIFFRUN_NO_LOCK=1
          base="$(jq -r .base patches/ergo-matrix/patches.json)"; out="$GITHUB_WORKSPACE/jars"; mkdir -p "$out"
          build(){ local j; for attempt in 1 2; do j="$(bash diffrun/build.sh "$@" | tail -1)" && [ -f "$j" ] && { echo "$j"; return 0; }; echo "build failed (attempt $attempt)" >&2; sleep 20; done; return 1; }
          cp "$(build "$base")" "$out/base.jar"
          cp "$(build "$base" "$base...${{ inputs.pr_head }}" -- src/main ergo-core/src/main)" "$out/pr2504.jar"
          { echo '```'; echo "weak-blocks base $base; #2504 head ${{ inputs.pr_head }}"; sha256sum "$out"/*.jar; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: paychain-jars, path: jars/, retention-days: 14 }

  run:
    needs: build
    name: ${{ matrix.build }}-${{ matrix.repeat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build: [ base, pr2504 ]
        repeat: [ 1, 2, 3, 4, 5 ]
    steps:
      - uses: actions/checkout@v4
      - name: Host prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe sch_netem
          sudo apt-get install -y -qq jq iproute2 >/dev/null
          { uname -r; nproc; free -m | head -2; } | tee host.txt
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: paychain-jars, path: jars }
      - name: Run matrix-paychain
        run: |
          run="$PWD/runs/${{ matrix.build }}-${{ matrix.repeat }}"; mkdir -p "$run"
          PEERYARD_MATRIX_JAR="$PWD/jars/${{ matrix.build }}.jar" SCRATCH="$run/scratch" \
            bash rig/rig.sh rig/examples/matrix-paychain.json rig/examples/matrix-paychain.sh > "$run/rig.log" 2>&1 || echo "rig exit $?"
          cp "$run"/scratch/out/{payments.jsonl,confirmed.jsonl,a_pool_end.txt,events.jsonl} "$run/" 2>/dev/null || true
          cp host.txt "$run/"; grep -E '^MATRIX-PAYCHAIN|\[matrix-paychain\] (accepted|INCONCLUSIVE|FAIL)' "$run/rig.log" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf "$run/scratch"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'run-${{ matrix.build }}-${{ matrix.repeat }}', path: runs/, retention-days: 30 }

  pool:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: 'run-*', merge-multiple: true }
      - name: Dependent and lost payments per build
        run: |
          { echo '```'; python3 diag/matrix_paychain.py --pool art/*/ ; echo '```'; } | tee pooled.txt >> "$GITHUB_STEP_SUMMARY"
          cat pooled.txt
      - uses: actions/upload-artifact@v4
        with: { name: matrix-paychain-pooled, path: pooled.txt, retention-days: 90 }
