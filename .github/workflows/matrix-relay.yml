# How far and how fast Matrix input blocks travel on a line of three nodes (A mines; B relays; C is two hops away),
# on GitHub-hosted runners (a development machine discovers; the runs a claim rests on are made where anyone can re-run
# them). Two builds of the weak-blocks line: the base commit peeryard carries (patches/ergo-matrix/patches.json), and the
# base plus patches/ergo-matrix/002-input-block-relay.patch alone (ergoplatform/ergo#2566). Each is run on the
# matrix-latency example with the links at 150 +- 100 ms and at 0 ms, with the wire observer on; diag/matrix_prop.py
# pools the input-block reach at C, the hop latency and the duplicates. Runs by hand.
name: peeryard matrix relay
on:
  workflow_dispatch:
    inputs:
      duration: { description: 'seconds each run observes', default: '180' }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: sbt/setup-sbt@v1
      - name: Cache the built jars (keyed by the Matrix patches and the build script)
        uses: actions/cache@v4
        with:
          path: ~/.cache/diffrun/builds
          key: peeryard-matrix-relay-${{ hashFiles('patches/ergo-matrix/**', 'diffrun/build.sh') }}
      - name: ergo clone (the weak-blocks commit)
        run: |
          git clone -q --filter=blob:none https://github.com/ergoplatform/ergo "$HOME/ergo-clone"
          git -C "$HOME/ergo-clone" fetch -q origin weak-blocks
          git -C "$HOME/ergo-clone" cat-file -e "$(jq -r .base patches/ergo-matrix/patches.json)^{commit}"
      - name: Cache the sigma-state snapshot the weak-blocks line depends on
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.scorexfoundation
          key: sigma-snapshot-${{ hashFiles('patches/ergo-matrix/patches.json', 'patches/sigma-snapshot.sh') }}
      - name: sigma-state snapshot (weak-blocks pins a -SNAPSHOT that is on no public repository)
        run: |
          export DIFFRUN_ERGO_CLONE="$HOME/ergo-clone" JAVA8_HOME="$JAVA_HOME"
          bash patches/sigma-snapshot.sh "$(jq -r .base patches/ergo-matrix/patches.json)"
      - name: Build the base and the base + #2566
        run: |
          export DIFFRUN_ERGO_CLONE="$HOME/ergo-clone" JAVA8_HOME="$JAVA_HOME" DIFFRUN_NO_LOCK=1
          base="$(jq -r .base patches/ergo-matrix/patches.json)"; out="$GITHUB_WORKSPACE/jars"; mkdir -p "$out"
          build(){ local j; for attempt in 1 2; do j="$(bash diffrun/build.sh "$@" | tail -1)" && [ -f "$j" ] && { echo "$j"; return 0; }; echo "build failed (attempt $attempt)" >&2; sleep 20; done; return 1; }
          cp "$(build "$base")" "$out/base.jar"
          cp "$(build "$base" patches/ergo-matrix/002-input-block-relay.patch)" "$out/fix.jar"
          { echo '```'; echo "weak-blocks base $base"; sha256sum "$out"/*.jar; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: matrix-jars, path: jars/, retention-days: 14 }

  run:
    needs: build
    name: ${{ matrix.build }}-${{ matrix.delay }}-${{ matrix.repeat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build: [ base, fix ]
        delay: [ d150, d0 ]
        repeat: [ 1, 2, 3 ]
    steps:
      - uses: actions/checkout@v4
      - name: Host prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe sch_netem
          sudo apt-get install -y -qq jq iproute2 >/dev/null
          { uname -r; nproc; free -m | head -2; } | tee host.txt
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: matrix-jars, path: jars }
      - name: Run matrix-latency with the wire observer
        run: |
          topo=rig/examples/matrix-latency.json
          if [ "${{ matrix.delay }}" = d0 ]; then jq '.links |= map(.delay_ms = 0 | .jitter_ms = 0)' "$topo" > d0.json; topo=d0.json; fi
          run="$PWD/runs/${{ matrix.build }}-${{ matrix.delay }}-${{ matrix.repeat }}"; mkdir -p "$run"
          PEERYARD_WIRE=1 PEERYARD_DURATION=${{ inputs.duration || '180' }} PEERYARD_MATRIX_JAR="$PWD/jars/${{ matrix.build }}.jar" \
            SCRATCH="$run/scratch" bash rig/rig.sh "$topo" rig/examples/matrix-latency.sh > "$run/rig.log" 2>&1 || echo "rig exit $?"
          cp "$run/scratch/out/messages.jsonl" "$run/" 2>/dev/null || echo "no messages.jsonl"
          # the capture's health (counts only, a few KB), never the pcaps: diag/README "Public and private"
          mkdir -p "$run/wire"; cp "$run"/scratch/out/wire/{*.stats.json,summary.json,capture.log} "$run/wire/" 2>/dev/null || true
          cp host.txt "$run/"; grep -E '\[rig\] WIRE|=== MATRIX-LATENCY' "$run/rig.log" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf "$run/scratch"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'run-${{ matrix.build }}-${{ matrix.delay }}-${{ matrix.repeat }}', path: runs/, retention-days: 30 }

  pool:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: 'run-*', merge-multiple: true }
      - name: Pooled reach, hop latency and duplicates
        run: |
          { echo '```'; python3 diag/matrix_prop.py art/*/ ; echo '```'; } | tee pooled.txt >> "$GITHUB_STEP_SUMMARY"
          cat pooled.txt
      - uses: actions/upload-artifact@v4
        with: { name: matrix-relay-pooled, path: pooled.txt, retention-days: 90 }
