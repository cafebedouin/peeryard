# Compare builds of the weak-blocks line on one rig example, on GitHub-hosted runners (a development machine discovers;
# the runs a claim rests on are made where anyone can re-run them): the base commit peeryard carries
# (patches/ergo-matrix/patches.json), and the base plus each named patch file alone. Every build runs the example at
# block version 3 and at version 4 (early soft-fork activation, rig PEERYARD_V4), `repeats` times. Each run keeps its
# rig log (the example's verdict and analysis lines), the ERROR lines and the gzipped node logs; diag/compare_pool.py pools
# them per build and version. Runs by hand.
name: peeryard patch compare
run-name: "patch compare: ${{ inputs.example }} x${{ inputs.repeats }} (${{ inputs.patches }})"
on:
  workflow_dispatch:
    inputs:
      patches: { description: 'space-separated patch files (repo paths), each built on the base alone', default: 'patches/ergo-matrix/candidates/2597-opt1-sender.patch patches/ergo-matrix/candidates/2597-opt2-follower.patch' }
      example: { description: 'rig example basename under rig/examples/ (Matrix line: jar from PEERYARD_MATRIX_JAR)', default: 'matrix-relay-star' }
      repeats: { description: 'runs per build and block version (1-10)', default: '5' }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      builds: ${{ steps.b.outputs.builds }}
      repeats: ${{ steps.b.outputs.repeats }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: sbt/setup-sbt@v1
      - name: Check the inputs
        env: { PATCHES: '${{ inputs.patches }}', EXAMPLE: '${{ inputs.example }}', REPEATS: '${{ inputs.repeats }}' }
        run: |
          [[ "$REPEATS" =~ ^([1-9]|10)$ ]] || { echo "repeats: 1-10"; exit 1; }
          [[ "$EXAMPLE" =~ ^[a-z0-9-]+$ && -f "rig/examples/$EXAMPLE.json" && -f "rig/examples/$EXAMPLE.sh" ]] || { echo "example: not under rig/examples/"; exit 1; }
          for p in $PATCHES; do [[ "$p" =~ ^patches/[A-Za-z0-9/._-]+\.patch$ && -f "$p" ]] || { echo "patch: $p not a patch file under patches/"; exit 1; }; done
      - name: Cache the built jars (keyed by the patches and the build script)
        uses: actions/cache@v4
        with:
          path: ~/.cache/diffrun/builds
          key: peeryard-patch-compare-${{ hashFiles('patches/ergo-matrix/**', 'diffrun/build.sh') }}
      - name: ergo clone (the weak-blocks commit)
        run: |
          git clone -q --filter=blob:none https://github.com/ergoplatform/ergo "$HOME/ergo-clone"
          git -C "$HOME/ergo-clone" fetch -q origin weak-blocks
          git -C "$HOME/ergo-clone" cat-file -e "$(jq -r .base patches/ergo-matrix/patches.json)^{commit}"
      - name: Cache the sigma-state snapshot the weak-blocks line depends on
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.scorexfoundation
          key: sigma-snapshot-${{ hashFiles('patches/ergo-matrix/patches.json', 'patches/sigma-snapshot.sh') }}
      - name: sigma-state snapshot (weak-blocks pins a -SNAPSHOT that is on no public repository)
        run: |
          export DIFFRUN_ERGO_CLONE="$HOME/ergo-clone" JAVA8_HOME="$JAVA_HOME"
          bash patches/sigma-snapshot.sh "$(jq -r .base patches/ergo-matrix/patches.json)"
      - name: Build the base and the base + each patch
        id: b
        env: { PATCHES: '${{ inputs.patches }}', REPEATS: '${{ inputs.repeats }}' }
        run: |
          export DIFFRUN_ERGO_CLONE="$HOME/ergo-clone" JAVA8_HOME="$JAVA_HOME" DIFFRUN_NO_LOCK=1
          base="$(jq -r .base patches/ergo-matrix/patches.json)"; out="$GITHUB_WORKSPACE/jars"; mkdir -p "$out"
          build(){ local j; for attempt in 1 2; do j="$(bash diffrun/build.sh "$@" | tail -1)" && [ -f "$j" ] && { echo "$j"; return 0; }; echo "build failed (attempt $attempt)" >&2; sleep 20; done; return 1; }
          cp "$(build "$base")" "$out/base.jar"; names=(base); echo "base: weak-blocks $base" > "$out/builds.txt"
          i=0; for p in $PATCHES; do i=$((i+1)); cp "$(build "$base" "$p")" "$out/p$i.jar"; names+=("p$i")
            echo "p$i: weak-blocks $base + $p (sha256 $(sha256sum "$p" | cut -c1-16))" >> "$out/builds.txt"; done
          echo "builds=$(printf '%s\n' "${names[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "repeats=$(seq 1 "$REPEATS" | jq -sc .)" >> "$GITHUB_OUTPUT"
          { echo '```'; cat "$out/builds.txt"; sha256sum "$out"/*.jar; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: compare-jars, path: jars/, retention-days: 14 }

  run:
    needs: build
    name: ${{ matrix.build }}-${{ matrix.version }}-${{ matrix.repeat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.build.outputs.builds) }}
        version: [ v3, v4 ]
        repeat: ${{ fromJSON(needs.build.outputs.repeats) }}
    steps:
      - uses: actions/checkout@v4
      - name: Host prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe sch_netem
          sudo apt-get install -y -qq jq iproute2 >/dev/null
          { uname -r; nproc; free -m | head -2; } | tee host.txt
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: compare-jars, path: jars }
      - name: Run the example
        env: { EXAMPLE: '${{ inputs.example }}' }
        run: |
          run="$PWD/runs/${{ matrix.build }}-${{ matrix.version }}-${{ matrix.repeat }}"; mkdir -p "$run"
          v4=0; [ "${{ matrix.version }}" = v4 ] && v4=1
          PEERYARD_V4=$v4 PEERYARD_MATRIX_JAR="$PWD/jars/${{ matrix.build }}.jar" SCRATCH="$run/scratch" \
            bash rig/rig.sh "rig/examples/$EXAMPLE.json" "rig/examples/$EXAMPLE.sh" > "$run/rig.log" 2>&1 || echo "rig exit $?"
          for f in "$run"/scratch/out/node_*.log; do [ -f "$f" ] || continue
            n=$(basename "$f" .log); grep -h ' ERROR ' "$f" | sed -E 's/^[0-9:.]+ ERROR +\[[^]]*\] //' | cut -c1-160 | sort | uniq -c > "$run/errors-$n.txt" || true; done
          cp host.txt jars/builds.txt "$run/"; grep -E '^(MATRIX-[A-Z]+|\[matrix-compat\] relay)' "$run/rig.log" | tee -a "$GITHUB_STEP_SUMMARY"
          # the node logs (gzipped, about 1 MB a run) and the rig's topology, so a result can be traced per block
          mkdir -p "$run/nodes"; for f in "$run"/scratch/out/node_*.log "$run"/scratch/out/effective.json; do [ -f "$f" ] && gzip -c "$f" > "$run/nodes/$(basename "$f").gz"; done
          rm -rf "$run/scratch"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'run-${{ matrix.build }}-${{ matrix.version }}-${{ matrix.repeat }}', path: runs/, retention-days: 30 }

  pool:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: 'run-*', merge-multiple: true }
      - name: Pooled per build and block version
        run: |
          { echo '```'; python3 diag/compare_pool.py art/; echo '```'; } | tee pooled.txt >> "$GITHUB_STEP_SUMMARY"
          cat pooled.txt
      - uses: actions/upload-artifact@v4
        with: { name: patch-compare-pooled, path: pooled.txt, retention-days: 90 }
