# Compare builds of the weak-blocks line on one rig example, on GitHub-hosted runners (a development machine discovers;
# the runs a claim rests on are made where anyone can re-run them): the base commit peeryard carries
# (patches/ergo-matrix/patches.json), and the base plus each named patch file alone. Every build runs the example at
# block version 3 and at version 4 (early soft-fork activation, rig PEERYARD_V4), `repeats` times. Each run keeps its
# rig log (the example's verdict and analysis lines), the ERROR lines and the gzipped node logs; diag/compare_pool.py pools
# them per build and version. Runs by hand.
# Opt-in inputs, each off by default so earlier runs stay reproducible: txload (a benign payment load on matrix-compat,
# rig/lib/txload.sh), extmine_poll (every miner an external miner polling /mining/candidate, rig/lib/extminer.py) and
# ref_2429 (the reference jar also carries patches/ergo/011, ergoplatform/ergo#2429's CandidateGenerator change, a
# rig-only patch), extmine_strict (those external miners read the candidate only on their poll schedule, extminer.py
# --strict) or ref_fairminer (011 plus patches/ergo/012, ergoplatform/ergo#2655's ErgoMiningThread change: a fair
# reference miner for share measurement, rig-only; it includes ref_2429), steady_from_h (matrix-compat: the window starts
# at that height, after the start-up difficulty ramp, and the devnet's forced difficulty 32 at h128 is off). builds.txt, copied into every run and printed
# at the head of the pooled output, names each jar with its sha256. matrix_base (opt-in): a full weak-blocks commit to
# build on instead of patches/ergo-matrix/patches.json's base (empty = that base, as before); the patches must be diffs
# from it. builds.txt's base line names the commit and where it came from.
# Opt-in measurement inputs (off by default, the run as before): wire (the rig's passive P2P capture, PEERYARD_WIRE=1;
# each run keeps the decoded messages.jsonl gzipped and the capture's health files, never the pcaps), versions (the
# block versions to run, default both), base_runs (false: build the base but run only the patches), txload_fund_split
# (each funded wallet gets that many boxes, rig/lib/txload.sh TXLOAD_FUND_SPLIT), txload_nodes (all, or matrix: only
# the Matrix nodes pay and are paid), txload_per_node (one sender per paying node) and txload_confirmed_only (each
# payment spends one confirmed box, no unconfirmed chains), node_conf (per-node config lines, e.g. a Matrix node with
# a build's setting turned off: a mixed arm in one network). Every run also gets
# diag/matrix_value.py's report (value.txt, value.json) when the example is a matrix-compat one; a report, no verdict.
name: peeryard patch compare
run-name: "patch compare: ${{ inputs.example }} x${{ inputs.repeats }} (${{ inputs.patches }})${{ inputs.matrix_base && format(' on {0}', inputs.matrix_base) || '' }}"
on:
  workflow_dispatch:
    inputs:
      patches: { description: 'space-separated patch files (repo paths), each built on the base alone', default: 'patches/ergo-matrix/candidates/2597-opt1-sender.patch patches/ergo-matrix/candidates/2597-opt2-follower.patch' }
      example: { description: 'rig example basename under rig/examples/ (Matrix line: jar from PEERYARD_MATRIX_JAR)', default: 'matrix-relay-star' }
      repeats: { description: 'runs per build and block version (1-10)', default: '5' }
      compat_s: { description: 'matrix-compat mining window in seconds (MATRIX_COMPAT_S; other examples ignore it)', default: '480' }
      compat_poll: { description: 'miners candidate poll interval, e.g. 500ms or 4s (PEERYARD_MINE_POLL and MATRIX_COMPAT_POLL)', default: '500ms' }
      txload: { description: 'matrix-compat payment load, payments per 10 s (0 = off; MATRIX_COMPAT_TXLOAD)', default: '0' }
      extmine_poll: { description: 'external miners polling /mining/candidate at this interval, e.g. 1s or 4s, instead of the internal CPU miner (empty = internal; PEERYARD_EXTMINE_POLL)', default: '' }
      extmine_strict: { description: 'external miners read the candidate only on the poll schedule, no read after a submission (pool-like; PEERYARD_EXTMINE_STRICT; needs extmine_poll)', type: boolean, default: false }
      ref_2429: { description: 'reference jar also carries patches/ergo/011 (#2429, rig-only)', type: boolean, default: false }
      ref_fairminer: { description: 'reference jar also carries patches/ergo/011 + 012 (#2429 + #2655, rig-only fair miner; implies ref_2429)', type: boolean, default: false }
      matrix_base: { description: 'full 40-hex weak-blocks commit to build the base and patches on (empty = patches/ergo-matrix/patches.json base, as before)', default: '' }
      steady_from_h: { description: 'matrix-compat: 0 = off (as before); else the window starts once A reaches this height (MATRIX_COMPAT_WARMUP_H) and the devnet difficulty reset to 32 at h128 is off (PEERYARD_NO_DIFF_RESET); 113 suggested', default: '0' }
      wire: { description: 'passive P2P capture on every link (PEERYARD_WIRE=1); keeps messages.jsonl.gz per run, never the pcaps', type: boolean, default: false }
      versions: { description: 'block versions to run: v3, v4 or both (space-separated)', default: 'v3 v4' }
      base_runs: { description: 'run the base jar too (false: build it, run only the patches)', type: boolean, default: true }
      txload_fund_split: { description: 'each wallet txload funds gets this many boxes (1-300; TXLOAD_FUND_SPLIT)', default: '1' }
      txload_nodes: { description: 'matrix-compat load among all nodes (all) or the Matrix nodes only (matrix; MATRIX_COMPAT_TXLOAD_NODES)', default: 'all' }
      txload_per_node: { description: 'one payment sender per paying node instead of one shared sender (TXLOAD_PER_NODE)', type: boolean, default: false }
      node_conf: { description: "per-node config lines, e.g. 'C:ergo.node.inputBlockUncles=false' (';'-separated; PEERYARD_NODE_CONF; empty = none)", default: '' }
      txload_confirmed_only: { description: 'each payment spends one confirmed box, no chains, 0.01 ERG (TXLOAD_CONFIRMED_ONLY)', type: boolean, default: false }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      builds: ${{ steps.b.outputs.builds }}
      repeats: ${{ steps.b.outputs.repeats }}
      versions: ${{ steps.b.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: sbt/setup-sbt@v1
      - name: Check the inputs
        env: { PATCHES: '${{ inputs.patches }}', EXAMPLE: '${{ inputs.example }}', REPEATS: '${{ inputs.repeats }}', COMPAT_S: '${{ inputs.compat_s }}', TXLOAD: '${{ inputs.txload }}', EXTMINE: '${{ inputs.extmine_poll }}', MATRIX_BASE: '${{ inputs.matrix_base }}', VERSIONS: '${{ inputs.versions }}', SPLIT: '${{ inputs.txload_fund_split }}', TXNODES: '${{ inputs.txload_nodes }}', NODECONF: '${{ inputs.node_conf }}' }
        run: |
          [[ -z "$NODECONF" || "$NODECONF" =~ ^[A-Za-z0-9_]+:[A-Za-z0-9_.]+=[A-Za-z0-9_.-]+(\;[A-Za-z0-9_]+:[A-Za-z0-9_.]+=[A-Za-z0-9_.-]+)*$ ]] || { echo "node_conf: <node>:<dotted.key>=<value>[;...]"; exit 1; }
          [[ "$VERSIONS" =~ ^(v3|v4)( (v3|v4))?$ ]] || { echo "versions: v3, v4 or 'v3 v4'"; exit 1; }
          [[ "$SPLIT" =~ ^[0-9]{1,3}$ && $SPLIT -ge 1 && $SPLIT -le 300 ]] || { echo "txload_fund_split: 1-300"; exit 1; }
          [[ "$TXNODES" =~ ^(all|matrix)$ ]] || { echo "txload_nodes: all or matrix"; exit 1; }
          [[ -z "$MATRIX_BASE" || "$MATRIX_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "matrix_base: empty, or a full 40-hex commit"; exit 1; }
          [[ "$TXLOAD" =~ ^([0-9]|[1-4][0-9]|50)$ ]] || { echo "txload: 0-50 payments per 10 s"; exit 1; }
          [[ -z "$EXTMINE" || "$EXTMINE" =~ ^[0-9]{1,5}(ms|s)$ ]] || { echo "extmine_poll: empty, or e.g. 1s or 4s"; exit 1; }
          [[ "$REPEATS" =~ ^([1-9]|10)$ ]] || { echo "repeats: 1-10"; exit 1; }
          [[ "$EXAMPLE" =~ ^[a-z0-9-]+$ && -f "rig/examples/$EXAMPLE.json" && -f "rig/examples/$EXAMPLE.sh" ]] || { echo "example: not under rig/examples/"; exit 1; }
          for p in $PATCHES; do [[ "$p" =~ ^patches/[A-Za-z0-9/._-]+\.patch$ && -f "$p" ]] || { echo "patch: $p not a patch file under patches/"; exit 1; }; done
          [[ "$COMPAT_S" =~ ^[0-9]{2,4}$ ]] || { echo "compat_s: 10-9999 seconds"; exit 1; }
      - name: Cache the built jars (keyed by the patches and the build script)
        uses: actions/cache@v4
        with:
          path: ~/.cache/diffrun/builds
          key: peeryard-patch-compare-${{ hashFiles('patches/**', 'diffrun/build.sh') }}
      - name: ergo clone (the weak-blocks commit)
        env: { MATRIX_BASE: '${{ inputs.matrix_base }}' }
        run: |
          base="${MATRIX_BASE:-$(jq -r .base patches/ergo-matrix/patches.json)}"
          git clone -q --filter=blob:none https://github.com/ergoplatform/ergo "$HOME/ergo-clone"
          git -C "$HOME/ergo-clone" fetch -q origin weak-blocks
          git -C "$HOME/ergo-clone" cat-file -e "$base^{commit}" 2>/dev/null || git -C "$HOME/ergo-clone" fetch -q origin "$base"
          git -C "$HOME/ergo-clone" cat-file -e "$base^{commit}"
      - name: Cache the sigma-state snapshot the weak-blocks line depends on
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.scorexfoundation
          key: sigma-snapshot-${{ hashFiles('patches/ergo-matrix/patches.json', 'patches/sigma-snapshot.sh') }}${{ inputs.matrix_base && format('-{0}', inputs.matrix_base) || '' }}
      - name: sigma-state snapshot (weak-blocks pins a -SNAPSHOT that is on no public repository)
        env: { MATRIX_BASE: '${{ inputs.matrix_base }}' }
        run: |
          export DIFFRUN_ERGO_CLONE="$HOME/ergo-clone" JAVA8_HOME="$JAVA_HOME"
          bash patches/sigma-snapshot.sh "${MATRIX_BASE:-$(jq -r .base patches/ergo-matrix/patches.json)}"
      - name: Build the base and the base + each patch
        id: b
        env: { PATCHES: '${{ inputs.patches }}', REPEATS: '${{ inputs.repeats }}', REF_2429: '${{ inputs.ref_2429 }}', REF_FAIR: '${{ inputs.ref_fairminer }}', MATRIX_BASE: '${{ inputs.matrix_base }}', VERSIONS: '${{ inputs.versions }}', BASE_RUNS: '${{ inputs.base_runs }}' }
        run: |
          export DIFFRUN_ERGO_CLONE="$HOME/ergo-clone" JAVA8_HOME="$JAVA_HOME" DIFFRUN_NO_LOCK=1
          base="${MATRIX_BASE:-$(jq -r .base patches/ergo-matrix/patches.json)}"; out="$GITHUB_WORKSPACE/jars"; mkdir -p "$out"
          bsrc=""; [ -n "$MATRIX_BASE" ] && bsrc=" (matrix_base input; patches.json base $(jq -r .base patches/ergo-matrix/patches.json))"
          build(){ local j; for attempt in 1 2; do j="$(bash diffrun/build.sh "$@" | tail -1)" && [ -f "$j" ] && { echo "$j"; return 0; }; echo "build failed (attempt $attempt)" >&2; sleep 20; done; return 1; }
          cp "$(build "$base")" "$out/base.jar"; names=(base); echo "base: weak-blocks $base$bsrc" > "$out/builds.txt"
          # the reference nodes of mixed examples (PEERYARD_JAR): the release-line stack, as the sweep builds it
          # ref_2429: the stack plus the rig-only patch 011 (stack.sh --for rig-2429); off, the default stack as before
          # ref_fairminer: the stack plus 011 and 012 (stack.sh --for rig-fairminer); it takes precedence over ref_2429
          forsc=(); refnote=""; [ "$REF_2429" = true ] && { forsc=(--for rig-2429); refnote=' (ref_2429: 011 = #2429, rig-only)'; }
          [ "$REF_FAIR" = true ] && { forsc=(--for rig-fairminer); refnote=' (ref_fairminer: 011 = #2429, 012 = #2655, rig-only)'; }
          ref=""; for attempt in 1 2; do ref="$(bash patches/stack.sh --build "${forsc[@]}" ergo | tail -1)" && [ -f "$ref" ] && break; ref=""; sleep 20; done
          [ -n "$ref" ] || { echo "reference stack did not build"; exit 1; }
          cp "$ref" "$out/reference.jar"
          echo "reference: $(jq -r .base patches/ergo/patches.json) + ergo stack patches $(jq -r '[.patches[].id] | join(",")' "$ref.stack.json")${refnote} (patches/ergo/patches.json)" >> "$out/builds.txt"
          i=0; for p in $PATCHES; do i=$((i+1)); cp "$(build "$base" "$p")" "$out/p$i.jar"; names+=("p$i")
            echo "p$i: weak-blocks $base + $p (sha256 $(sha256sum "$p" | cut -c1-16))" >> "$out/builds.txt"; done
          # every jar by sha256, in the file every run carries: a result names the jars it ran
          (cd "$out" && sha256sum ./*.jar | sed 's#\./##; s/^/jar sha256 /') >> "$out/builds.txt"
          # base_runs false: the base jar is built (builds.txt names it) but only the patches run
          [ "$BASE_RUNS" = false ] && [ "${#names[@]}" -gt 1 ] && names=("${names[@]:1}")
          echo "builds=$(printf '%s\n' "${names[@]}" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "repeats=$(seq 1 "$REPEATS" | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "versions=$(printf '%s\n' ${VERSIONS:-v3 v4} | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          { echo '```'; cat "$out/builds.txt"; sha256sum "$out"/*.jar; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: compare-jars, path: jars/, retention-days: 14 }

  run:
    needs: build
    name: ${{ matrix.build }}-${{ matrix.version }}-${{ matrix.repeat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.build.outputs.builds) }}
        version: ${{ fromJSON(needs.build.outputs.versions) }}
        repeat: ${{ fromJSON(needs.build.outputs.repeats) }}
    steps:
      - uses: actions/checkout@v4
      - name: Host prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe sch_netem
          sudo apt-get install -y -qq jq iproute2 >/dev/null
          { uname -r; nproc; free -m | head -2; } | tee host.txt
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: compare-jars, path: jars }
      - name: Run the example
        env: { EXAMPLE: '${{ inputs.example }}', COMPAT_S: '${{ inputs.compat_s }}', COMPAT_POLL: '${{ inputs.compat_poll }}', TXLOAD: '${{ inputs.txload }}', EXTMINE: '${{ inputs.extmine_poll }}', EXTSTRICT: "${{ inputs.extmine_strict && '1' || '0' }}", STEADY_H: '${{ inputs.steady_from_h }}', WIRE: "${{ inputs.wire && '1' || '0' }}", SPLIT: '${{ inputs.txload_fund_split }}', TXNODES: '${{ inputs.txload_nodes }}', PERNODE: "${{ inputs.txload_per_node && '1' || '0' }}", CONFONLY: "${{ inputs.txload_confirmed_only && '1' || '0' }}", NODECONF: '${{ inputs.node_conf }}' }
        run: |
          [[ "$COMPAT_POLL" =~ ^[0-9]{1,5}(ms|s)$ ]] || { echo "compat_poll: e.g. 500ms or 4s"; exit 1; }
          [[ "$STEADY_H" =~ ^[0-9]{1,4}$ ]] || { echo "steady_from_h: a height, 0 = off"; exit 1; }
          ndr=0; [ "$STEADY_H" -gt 0 ] && ndr=1
          run="$PWD/runs/${{ matrix.build }}-${{ matrix.version }}-${{ matrix.repeat }}"; mkdir -p "$run"
          v4=0; [ "${{ matrix.version }}" = v4 ] && v4=1
          PEERYARD_V4=$v4 PEERYARD_MATRIX_JAR="$PWD/jars/${{ matrix.build }}.jar" PEERYARD_JAR="$PWD/jars/reference.jar" \
            MATRIX_COMPAT_S="$COMPAT_S" PEERYARD_MINE_POLL="$COMPAT_POLL" MATRIX_COMPAT_POLL="$COMPAT_POLL" SCRATCH="$run/scratch" \
            MATRIX_COMPAT_TXLOAD="$TXLOAD" PEERYARD_EXTMINE_POLL="$EXTMINE" PEERYARD_EXTMINE_STRICT="$EXTSTRICT" \
            MATRIX_COMPAT_WARMUP_H="$STEADY_H" PEERYARD_NO_DIFF_RESET="$ndr" PEERYARD_WIRE="$WIRE" TXLOAD_FUND_SPLIT="$SPLIT" \
            MATRIX_COMPAT_TXLOAD_NODES="$TXNODES" TXLOAD_PER_NODE="$PERNODE" TXLOAD_CONFIRMED_ONLY="$CONFONLY" PEERYARD_NODE_CONF="$NODECONF" \
            bash rig/rig.sh "rig/examples/$EXAMPLE.json" "rig/examples/$EXAMPLE.sh" > "$run/rig.log" 2>&1 || echo "rig exit $?"
          for f in "$run"/scratch/out/node_*.log; do [ -f "$f" ] || continue
            n=$(basename "$f" .log); grep -h ' ERROR ' "$f" | sed -E 's/^[0-9:.]+ ERROR +\[[^]]*\] //' | cut -c1-160 | sort | uniq -c > "$run/errors-$n.txt" || true; done
          cp host.txt jars/builds.txt "$run/"; grep -E '^(MATRIX-[A-Z]+|\[matrix-compat\] relay)' "$run/rig.log" | tee -a "$GITHUB_STEP_SUMMARY"
          # the payment records and the external miners' logs, when those inputs were on (gzipped)
          mkdir -p "$run/load"; for f in "$run"/scratch/out/{txload.jsonl,txwatch.jsonl,txload_pools.json,txload_chain.jsonl,txrecords.jsonl,txload.err} "$run"/scratch/out/extminer_*.log; do
            [ -s "$f" ] && gzip -c "$f" > "$run/load/$(basename "$f").gz"; done; rmdir "$run/load" 2>/dev/null || true
          # the node logs (gzipped, about 1 MB a run) and the rig's topology, so a result can be traced per block
          mkdir -p "$run/nodes"; for f in "$run"/scratch/out/node_*.log "$run"/scratch/out/effective.json; do [ -f "$f" ] && gzip -c "$f" > "$run/nodes/$(basename "$f").gz"; done
          # wire on: the decoded messages (gzipped) and the capture's health files; the pcaps are never uploaded
          if [ "$WIRE" = 1 ]; then
            [ -s "$run/scratch/out/messages.jsonl" ] && gzip -c "$run/scratch/out/messages.jsonl" > "$run/messages.jsonl.gz"
            mkdir -p "$run/wire"; cp "$run"/scratch/out/wire/*.stats.json "$run"/scratch/out/wire/summary.json "$run"/scratch/out/wire/capture.log "$run/wire/" 2>/dev/null || true
            du -sh "$run"/scratch/out/wire/*.pcap 2>/dev/null | tee "$run/wire/pcap-sizes.txt" || true
          fi
          # the value / bytes / requests / load report over this run's artifact layout (a report; it never fails the job)
          if [[ "$EXAMPLE" == matrix-compat* ]]; then
            python3 diag/matrix_value.py "$run" --json "$run/value.json" > "$run/value.txt" 2>&1 || echo "matrix_value.py failed (see value.txt)"
            grep -E '^(BYTES|REQUESTS|VALUE|LOAD|WIRE)' "$run/value.txt" | cut -c1-400 | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
          rm -rf "$run/scratch"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'run-${{ matrix.build }}-${{ matrix.version }}-${{ matrix.repeat }}', path: runs/, retention-days: 30 }

  pool:
    needs: run
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: 'run-*', merge-multiple: true }
      - name: Pooled per build and block version
        run: |
          { echo '```'; python3 diag/compare_pool.py art/; echo '```'; } | tee pooled.txt >> "$GITHUB_STEP_SUMMARY"
          cat pooled.txt
      - uses: actions/upload-artifact@v4
        with: { name: patch-compare-pooled, path: pooled.txt, retention-days: 90 }
