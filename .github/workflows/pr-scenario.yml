# One diffrun scenario, before and after an ergoplatform/ergo pull request, on GitHub-hosted runners (a verdict rests on
# a runner class anyone can re-run). The build job builds BOTH jars here with diffrun/build.sh from one base commit: the
# base alone, and the base plus the PR's production diff (<PR base branch>...<head>, restricted to the production
# dirs), so the pair differs only in the patch. The base is the Matrix commit peeryard carries
# (patches/ergo-matrix/patches.json, line=matrix) or a release tag. Each of `shards` runners then runs `pairs` pairs
# (base run, candidate run, alternating, run.sh's order), and diffrun/pool.sh judges the pooled runs once
# (role_summary/decide over shards x pairs; a lost shard counts as INCONCLUSIVE runs). With aa=true the base jar runs
# in both roles (an A/A control, labelled so; no PR is fetched). Runs by hand.
name: peeryard PR scenario
on:
  workflow_dispatch:
    inputs:
      pr: { description: 'ergoplatform/ergo pull request number (ignored when aa is true)', default: '' }
      head: { description: 'the PR head commit, 40 hex (the run fails if the PR has moved; ignored when aa is true)', default: '' }
      line: { description: 'matrix (the weak-blocks commit in patches/ergo-matrix/patches.json) or a release tag, e.g. v6.0.6', default: 'v6.0.6' }
      scenario: { description: 'manifest basename under diffrun/scenarios/ (without .json); public tier, no stop_when/max_n', default: 'matrix-paychain' }
      shards: { description: 'runners (1-20)', default: '5' }
      pairs: { description: 'pairs per runner (1-99)', default: '1' }
      aa: { description: 'A/A control: the base jar in both roles, no candidate built', type: boolean, default: false }
run-name: "${{ inputs.scenario }}: ${{ inputs.aa && 'A/A' || format('#{0}', inputs.pr) }} on ${{ inputs.line }} (${{ inputs.shards }}x${{ inputs.pairs }})"
permissions:
  contents: read
env:
  PR: ${{ inputs.pr }}
  HEAD_SHA: ${{ inputs.head }}
  LINE: ${{ inputs.line }}
  SCENARIO: ${{ inputs.scenario }}
  SHARDS: ${{ inputs.shards }}
  PAIRS: ${{ inputs.pairs }}
  AA: ${{ inputs.aa }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DIFFRUN_NO_LOCK: 1
      DIFFRUN_ERGO_CLONE: ${{ github.workspace }}/../ergo-clone
    outputs:
      shards: ${{ steps.inputs.outputs.shards }}
      run_minutes: ${{ steps.inputs.outputs.run_minutes }}
    steps:
      - uses: actions/checkout@v4
      - name: Inputs (validated before anything else; the dispatch cannot be rejected earlier)
        id: inputs
        run: |
          set -euo pipefail
          fail(){ echo "::error::$*"; exit 1; }
          [[ "$SCENARIO" =~ ^[a-z0-9-]+$ ]] || fail "scenario: [a-z0-9-] only"
          m="diffrun/scenarios/$SCENARIO.json"; [ -f "$m" ] || fail "no manifest $m"
          [[ "$LINE" == matrix || "$LINE" =~ ^v[0-9.]+$ ]] || fail "line: matrix or a release tag vN.N.N"
          { [[ "$SHARDS" =~ ^[1-9][0-9]?$ ]] && [ "$SHARDS" -le 20 ]; } || fail "shards: 1-20"
          [[ "$PAIRS" =~ ^[1-9][0-9]?$ ]] || fail "pairs: 1-99"
          if [ "$AA" = true ]; then echo "A/A control: pr and head are ignored"
          else
            [[ "$PR" =~ ^[0-9]+$ ]] || fail "pr: a number"
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "head: 40 lowercase hex"
          fi
          jq -L diffrun/lib -e 'include "diffrun"; validate_manifest | length == 0' "$m" >/dev/null || fail "manifest does not validate"
          [ "$(jq -r .tier "$m")" = public ] || fail "tier: only public manifests run here"
          jq -e 'has("stop_when") or has("max_n") | not' "$m" >/dev/null || fail "stop_when/max_n: a sequential stop inside a shard breaks the pairs-per-shard accounting"
          echo "shards=$(jq -nc --argjson n "$SHARDS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"
          echo "run_minutes=$(jq -r --argjson k "$PAIRS" '(2 * $k * ((.timeout_seconds // 900) + (if has("precheck") then .precheck_timeout_seconds // 300 else 0 end)) / 60 | floor) + 30' "$m")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: sbt/setup-sbt@v1
      - name: ergo clone, the build base and the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail(){ echo "::error::$*"; exit 1; }
          C="$DIFFRUN_ERGO_CLONE"
          git clone -q --filter=blob:none https://github.com/ergoplatform/ergo "$C"
          if [ "$LINE" = matrix ]; then
            BASE="$(jq -r .base patches/ergo-matrix/patches.json)"; git -C "$C" fetch -q origin weak-blocks
          else
            BASE="$LINE"; git -C "$C" fetch -q origin "refs/tags/$LINE:refs/tags/$LINE"
          fi
          BSHA="$(git -C "$C" rev-parse --verify "$BASE^{commit}")" || fail "build base $BASE not found"
          { echo "BASE=$BASE"; echo "BSHA=$BSHA"; } >> "$GITHUB_ENV"
          { echo '```'; echo "build base: $BASE ($BSHA)"; } > summary.txt
          if [ "$AA" != true ]; then
            B="$(gh api "repos/ergoplatform/ergo/pulls/$PR" --jq .base.ref)"
            [[ "$B" =~ ^[A-Za-z0-9._/-]+$ ]] || fail "unexpected base branch name"
            git -C "$C" fetch -q origin "+refs/heads/$B:refs/remotes/origin/$B" "+pull/$PR/head:refs/heads/pr-$PR"
            head="$(git -C "$C" rev-parse "pr-$PR")"
            [ "$head" = "$HEAD_SHA" ] || fail "#$PR head is $head, expected $HEAD_SHA: re-dispatch with head=$head after reading the change"
            TIP="$(git -C "$C" rev-parse "origin/$B")"; MB="$(git -C "$C" merge-base "origin/$B" "pr-$PR")"
            { echo "PR #$PR base branch: $B (tip $TIP)"; echo "PR head: $HEAD_SHA"; echo "merge-base: $MB"
              echo "merge-base == build base: $([ "$MB" = "$BSHA" ] && echo true || echo false)"; } >> summary.txt
            # a PR branched from a newer commit than the build base can still apply cleanly, and "build base + PR diff"
            # would then be a false label
            git -C "$C" merge-base --is-ancestor "$MB" "$BSHA" || { cat summary.txt >> "$GITHUB_STEP_SUMMARY"; fail "merge-base $MB is not an ancestor of the build base $BSHA"; }
            echo "RANGE=origin/$B...pr-$PR" >> "$GITHUB_ENV"
          fi
      - name: Cache the sigma-state snapshot the weak-blocks line depends on
        if: env.LINE == 'matrix'
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.scorexfoundation
          key: sigma-snapshot-${{ hashFiles('patches/ergo-matrix/patches.json', 'patches/sigma-snapshot.sh') }}
      - name: sigma-state snapshot (weak-blocks pins a -SNAPSHOT that is on no public repository)
        if: env.LINE == 'matrix'
        run: JAVA8_HOME="$JAVA_HOME" bash patches/sigma-snapshot.sh "$BASE"
      - name: Build the base and the base + the PR's diff
        run: |
          set -euo pipefail
          export JAVA8_HOME="$JAVA_HOME"
          PATHS=(src/main ergo-core/src/main ergo-wallet/src/main avldb/src/main)
          mkdir -p jars
          build(){ local j; for attempt in 1 2; do j="$(bash diffrun/build.sh "$@" | tail -1)" && [ -f "$j" ] && { echo "$j"; return 0; }; echo "build failed (attempt $attempt)" >&2; sleep 20; done; return 1; }
          put(){ cp "$2" "jars/$1.jar"; cp "$2.json" "jars/$1.jar.json"; }
          put base "$(build "$BASE")"
          if [ "$AA" != true ]; then
            bash diffrun/build.sh --dry-run "$BASE" "$RANGE" -- "${PATHS[@]}" > jars/candidate.patch 2> dry.txt || { cat dry.txt; exit 1; }
            { echo "candidate patch ($RANGE, ${PATHS[*]}): sha256 $(sha256sum jars/candidate.patch | cut -d' ' -f1)"; grep -E '^build: files' dry.txt; } >> summary.txt
            put candidate "$(build "$BASE" "$RANGE" -- "${PATHS[@]}")"
            echo "candidate: build base $BSHA + PR #$PR diff (merge-base $(grep -oE '^merge-base: [0-9a-f]+' summary.txt | cut -d' ' -f2), head $HEAD_SHA)" >> summary.txt
          else
            echo "A/A control: the base jar in both roles" >> summary.txt
          fi
          { (cd jars && sha256sum ./*.jar); for s in jars/*.jar.json; do echo "$(basename "$s"): $(jq -c '{expected_app_version, source_sha, patch: .patch.sha256}' "$s")"; done; echo '```'; } >> summary.txt
          tee -a "$GITHUB_STEP_SUMMARY" < summary.txt; cp summary.txt jars/build-summary.txt
      - uses: actions/upload-artifact@v4
        with: { name: pr-scenario-jars, path: jars/, retention-days: 90 }

  run:
    needs: build
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.build.outputs.run_minutes) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Host prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe sch_netem
          sudo apt-get install -y -qq jq iproute2 >/dev/null
          unshare -Urmn true && echo "userns ok"
          { uname -r; nproc; free -m | head -2; } | tee host.txt
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: pr-scenario-jars, path: jars }
      - name: Run the shard (pairs of base, candidate)
        env:
          K: ${{ matrix.shard }}
        run: |
          o="$RUNNER_TEMP/out/shard-$K"; cand="$PWD/jars/candidate.jar"; [ "$AA" = true ] && cand="$PWD/jars/base.jar"
          bash diffrun/run.sh "diffrun/scenarios/$SCENARIO.json" --base "$PWD/jars/base.jar" --candidate "$cand" -n "$PAIRS" --out "$o" || echo "run.sh exit $?"
          # the shard's outputs minus run_meta.json (local paths) and node data: pool.sh reads verdict.json and manifest.json
          u="upload/shard-$K"; mkdir -p "$u"; cp host.txt "$u/"
          for f in verdict.json table.txt manifest.json base.sidecar.json candidate.sidecar.json runs.jsonl; do cp "$o/$f" "$u/" 2>/dev/null || true; done
          for r in "$o"/runs/*/; do t="$u/runs/$(basename "$r")"; mkdir -p "$t"; cp "$r"/{metadata.json,result.json,stdout.txt,stderr.txt} "$t/" 2>/dev/null || true; done
          if [ -f "$u/table.txt" ]; then tee -a "$GITHUB_STEP_SUMMARY" < "$u/table.txt"; else echo "shard $K: no verdict" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'shard-${{ matrix.shard }}', path: 'upload/shard-${{ matrix.shard }}/', retention-days: 90 }

  pool:
    needs: [build, run]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: 'shard-*', merge-multiple: false }
      - name: One verdict over the shards
        run: |
          mkdir -p art
          bash diffrun/pool.sh --out pooled --shards "$SHARDS" --pairs "$PAIRS" art; rc=$?
          { echo '```'; cat pooled/table.txt 2>/dev/null || echo "pool.sh exit $rc: no verdict"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pr-scenario-pooled, path: pooled/, retention-days: 90 }
