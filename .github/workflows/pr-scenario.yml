# One diffrun scenario, before and after an ergoplatform/ergo pull request, on GitHub-hosted runners (a verdict rests on
# a runner class anyone can re-run). The build job builds BOTH jars here with diffrun/build.sh from one base commit: the
# base alone, and the base plus the PR's production diff (<PR base branch>...<head>, restricted to the production
# dirs), so the pair differs only in the patch. Each of `shards` runners then runs `pairs` pairs (base run, candidate
# run, alternating, run.sh's order), and diffrun/pool.sh judges the pooled runs once (role_summary/decide over
# shards x pairs; a lost shard counts as INCONCLUSIVE runs). With aa=true the base jar runs in both roles (an A/A
# control, labelled so; no PR is fetched). Runs by hand.
#
# line (the build base):
#   matrix         the weak-blocks commit peeryard carries (patches/ergo-matrix/patches.json)
#   matrix-stack   that commit plus the carried Matrix stack: the base jar is patches/stack.sh --build ergo-matrix, and
#                  the candidate stacks the PR's diff last through stack.sh's overlay, so the pair still differs only in
#                  the PR's diff
#   vN.N.N         a release tag
#   <40 hex>       a commit, e.g. the PR's own merge base, so the pair is that commit and that commit plus the PR's diff
# The PR's diff: when the line's commit is one of the PR's merge bases (`git merge-base --all`; a PR that merged its
# base branch in has several), the diff is taken from that commit itself; otherwise from git's merge base, which must
# be an ancestor of the line's commit (a PR branched from a newer commit fails the build job).
#
# test_patches (a release tag or a commit line only): space-separated files under patches/test/ (test-only changes
# such as a short storage period, never proposed upstream) applied to BOTH arms as one local commit on the line's
# commit, which becomes the build base; the merge-base rules above still run against the line's commit, and the
# summary names each patch with a sha256 prefix.
# scenario_env: KEY=VALUE overrides of the manifest's env, ";"-separated (diffrun/scenario-env.sh: only keys the
# manifest declares, values [A-Za-z0-9._ :,-]), written into the checked-out manifest so verdict.json's provenance
# records the effective env.
# run-name markers: "A/A" or "#<pr>", the line, shards x pairs, " v4", " +test patches", " [<scenario_env>]".
name: peeryard PR scenario
on:
  workflow_dispatch:
    inputs:
      pr: { description: 'ergoplatform/ergo pull request number (ignored when aa is true)', default: '' }
      head: { description: 'the PR head commit, 40 hex (the run fails if the PR has moved; ignored when aa is true)', default: '' }
      line: { description: 'matrix (the weak-blocks commit in patches/ergo-matrix/patches.json), matrix-stack (that commit + the carried Matrix stack), a release tag, e.g. v6.0.8, or a commit (40 hex). The line must contain the PR''s merge base: for a PR on a branch ahead of the release, give the merge base itself', default: 'v6.0.8' }
      scenario: { description: 'manifest basename under diffrun/scenarios/ (without .json); public tier, no stop_when/max_n', default: 'matrix-paychain' }
      shards: { description: 'runners (1-20)', default: '5' }
      pairs: { description: 'pairs per runner (1-99)', default: '1' }
      aa: { description: 'A/A control: the base jar in both roles, no candidate built', type: boolean, default: false }
      scenario_env: { description: 'optional: KEY=VALUE overrides of the manifest env, separated by ";" (keys the manifest declares; values [A-Za-z0-9._ :,-]), e.g. WO_AT=pending', default: '' }
      v4: { description: 'Matrix line at block version 4 (early soft-fork activation, rig PEERYARD_V4)', type: boolean, default: false }
      test_patches: { description: 'optional, a release tag or commit line only: space-separated test patches under patches/test/, applied to BOTH arms (the build base becomes the line''s commit plus them, one local commit), e.g. patches/test/storage-period-60.patch', default: '' }
run-name: "${{ inputs.scenario }}: ${{ inputs.aa && 'A/A' || format('#{0}', inputs.pr) }} on ${{ inputs.line }} (${{ inputs.shards }}x${{ inputs.pairs }})${{ inputs.v4 && ' v4' || '' }}${{ inputs.test_patches != '' && ' +test patches' || '' }}${{ inputs.scenario_env != '' && format(' [{0}]', inputs.scenario_env) || '' }}"
permissions:
  contents: read
env:
  PR: ${{ inputs.pr }}
  HEAD_SHA: ${{ inputs.head }}
  LINE: ${{ inputs.line }}
  SCENARIO: ${{ inputs.scenario }}
  SHARDS: ${{ inputs.shards }}
  PAIRS: ${{ inputs.pairs }}
  AA: ${{ inputs.aa }}
  PEERYARD_V4: ${{ inputs.v4 && '1' || '0' }}
  TEST_PATCHES: ${{ inputs.test_patches }}
  SCENARIO_ENV: ${{ inputs.scenario_env }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DIFFRUN_NO_LOCK: 1
      DIFFRUN_ERGO_CLONE: ${{ github.workspace }}/../ergo-clone
    outputs:
      shards: ${{ steps.inputs.outputs.shards }}
      run_minutes: ${{ steps.inputs.outputs.run_minutes }}
    steps:
      - uses: actions/checkout@v4
      - name: Inputs (validated before anything else; the dispatch cannot be rejected earlier)
        id: inputs
        run: |
          set -euo pipefail
          fail(){ echo "::error::$*"; exit 1; }
          [[ "$SCENARIO" =~ ^[a-z0-9-]+$ ]] || fail "scenario: [a-z0-9-] only"
          m="diffrun/scenarios/$SCENARIO.json"; [ -f "$m" ] || fail "no manifest $m"
          [[ "$LINE" == matrix || "$LINE" == matrix-stack || "$LINE" =~ ^v[0-9.]+$ || "$LINE" =~ ^[0-9a-f]{40}$ ]] || fail "line: matrix, matrix-stack, a release tag vN.N.N or a 40-hex commit"
          { [[ "$SHARDS" =~ ^[1-9][0-9]?$ ]] && [ "$SHARDS" -le 20 ]; } || fail "shards: 1-20"
          [[ "$PAIRS" =~ ^[1-9][0-9]?$ ]] || fail "pairs: 1-99"
          for t in $TEST_PATCHES; do [[ "$t" =~ ^patches/test/[A-Za-z0-9._-]+\.patch$ && -f "$t" ]] || fail "test patch $t: not a file under patches/test/"; done
          [ -z "$TEST_PATCHES" ] || [[ "$LINE" =~ ^v[0-9.]+$ || "$LINE" =~ ^[0-9a-f]{40}$ ]] || fail "test_patches: a release tag or a commit line only (the matrix lines build through patches/stack.sh)"
          if [ "$AA" = true ]; then echo "A/A control: pr and head are ignored"
          else
            [[ "$PR" =~ ^[0-9]+$ ]] || fail "pr: a number"
            [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || fail "head: 40 lowercase hex"
            if [ "$LINE" = matrix-stack ]; then   # a stack member's diff would be applied twice (stack.sh's default set: no only_for)
              in_stack="$(jq -r --argjson pr "$PR" '.stack_statuses as $s | [.patches[] | select(.upstream_pr == $pr and (.status as $x | $s | index($x)) and (.only_for // null) == null) | .id] | join(" ")' patches/ergo-matrix/patches.json)"
              [ -z "$in_stack" ] || fail "line=matrix-stack: #$PR is already in the Matrix stack (patch $in_stack); the candidate is the stack plus a PR outside it"
            fi
          fi
          bash diffrun/scenario-env.sh "$m" "$SCENARIO_ENV" || fail "scenario_env: see the line above"
          jq -L diffrun/lib -e 'include "diffrun"; validate_manifest | length == 0' "$m" >/dev/null || fail "manifest does not validate"
          [ "$(jq -r .tier "$m")" = public ] || fail "tier: only public manifests run here"
          jq -e 'has("stop_when") or has("max_n") | not' "$m" >/dev/null || fail "stop_when/max_n: a sequential stop inside a shard breaks the pairs-per-shard accounting"
          echo "shards=$(jq -nc --argjson n "$SHARDS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"
          echo "run_minutes=$(jq -r --argjson k "$PAIRS" '(2 * $k * ((.timeout_seconds // 900) + (if has("precheck") then .precheck_timeout_seconds // 300 else 0 end)) / 60 | floor) + 30' "$m")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: sbt/setup-sbt@v1
      - name: ergo clone, the build base and the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail(){ echo "::error::$*"; exit 1; }
          C="$DIFFRUN_ERGO_CLONE"
          git clone -q --filter=blob:none https://github.com/ergoplatform/ergo "$C"
          if [ "$LINE" = matrix ] || [ "$LINE" = matrix-stack ]; then
            BASE="$(jq -r .base patches/ergo-matrix/patches.json)"; git -C "$C" fetch -q origin weak-blocks
          elif [[ "$LINE" =~ ^[0-9a-f]{40}$ ]]; then
            BASE="$LINE"; git -C "$C" cat-file -e "$LINE^{commit}" 2>/dev/null || git -C "$C" fetch -q origin "$LINE"
          else
            BASE="$LINE"; git -C "$C" fetch -q origin "refs/tags/$LINE:refs/tags/$LINE"
          fi
          BSHA="$(git -C "$C" rev-parse --verify "$BASE^{commit}")" || fail "build base $BASE not found"
          LSHA="$BSHA"   # the line's own commit (tag, commit or Matrix base), before any test patch
          TPLINE=""
          if [ -n "$TEST_PATCHES" ]; then
            # test-only patches on BOTH arms: one local commit on the line's commit becomes the build base, so the pair
            # still differs only in the PR's diff; the merge-base checks below run against the line's commit (LSHA)
            git -C "$C" -c advice.detachedHead=false checkout -q "$BSHA"
            for t in $TEST_PATCHES; do git -C "$C" apply --index "$GITHUB_WORKSPACE/$t" || fail "test patch $t does not apply on $BASE"; TPLINE="$TPLINE $t($(sha256sum "$t" | cut -c1-16))"; done
            git -C "$C" -c user.name=pr-scenario -c user.email=pr-scenario@localhost commit -q -m "TEST ONLY: $TEST_PATCHES"
            BSHA="$(git -C "$C" rev-parse HEAD)"; BASE="$BSHA"
          fi
          { echo "BASE=$BASE"; echo "BSHA=$BSHA"; echo "LSHA=$LSHA"; } >> "$GITHUB_ENV"
          { echo '```'; echo "build base: $LINE${TPLINE:+ + test patches:$TPLINE} ($BSHA)"; [ -z "$SCENARIO_ENV" ] || echo "scenario env overrides: $SCENARIO_ENV"; } > summary.txt
          if [ "$AA" != true ]; then
            B="$(gh api "repos/ergoplatform/ergo/pulls/$PR" --jq .base.ref)"
            [[ "$B" =~ ^[A-Za-z0-9._/-]+$ ]] || fail "unexpected base branch name"
            git -C "$C" fetch -q origin "+refs/heads/$B:refs/remotes/origin/$B" "+pull/$PR/head:refs/heads/pr-$PR"
            head="$(git -C "$C" rev-parse "pr-$PR")"
            [ "$head" = "$HEAD_SHA" ] || fail "#$PR head is $head, expected $HEAD_SHA: re-dispatch with head=$head after reading the change"
            TIP="$(git -C "$C" rev-parse "origin/$B")"; MB="$(git -C "$C" merge-base "origin/$B" "pr-$PR")"
            ALL_MB="$(git -C "$C" merge-base --all "origin/$B" "pr-$PR" | tr '\n' ' ')"; RANGE="origin/$B...pr-$PR"
            # the line's commit is one of several merge bases (the PR merged its base branch in): the diff is taken from
            # that commit itself, so the candidate is the build base plus exactly what the PR adds to it
            if [[ " $ALL_MB" == *" $LSHA "* ]]; then MB="$LSHA"; RANGE="$LSHA..pr-$PR"; fi
            { echo "PR #$PR base branch: $B (tip $TIP)"; echo "PR head: $HEAD_SHA"; echo "merge-base: $MB"
              [ "$(wc -w <<< "$ALL_MB")" -le 1 ] || echo "merge bases (--all): $ALL_MB; diff range $RANGE"
              echo "merge-base == line commit${TPLINE:+ (before the test patches)}: $([ "$MB" = "$LSHA" ] && echo true || echo false)"; } >> summary.txt
            # a PR branched from a newer commit than the line's can still apply cleanly, and "build base + PR diff"
            # would then be a false label (the test-patch commit's parent is LSHA, so this is the same test on BSHA)
            git -C "$C" merge-base --is-ancestor "$MB" "$LSHA" || { cat summary.txt >> "$GITHUB_STEP_SUMMARY"; fail "merge-base $MB is not an ancestor of the line's commit $LSHA"; }
            echo "RANGE=$RANGE" >> "$GITHUB_ENV"
          fi
      - name: Cache the sigma-state snapshot the weak-blocks line depends on
        if: env.LINE == 'matrix' || env.LINE == 'matrix-stack'
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.scorexfoundation
          key: sigma-snapshot-${{ hashFiles('patches/ergo-matrix/patches.json', 'patches/sigma-snapshot.sh') }}
      - name: sigma-state snapshot (weak-blocks pins a -SNAPSHOT that is on no public repository)
        if: env.LINE == 'matrix' || env.LINE == 'matrix-stack'
        run: JAVA8_HOME="$JAVA_HOME" bash patches/sigma-snapshot.sh "$BASE"
      - name: Build the base and the base + the PR's diff
        run: |
          set -euo pipefail
          export JAVA8_HOME="$JAVA_HOME"
          PATHS=(src/main ergo-core/src/main ergo-wallet/src/main avldb/src/main)
          mkdir -p jars
          build(){ local j; for attempt in 1 2; do j="$(bash diffrun/build.sh "$@" | tail -1)" && [ -f "$j" ] && { echo "$j"; return 0; }; echo "build failed (attempt $attempt)" >&2; sleep 20; done; return 1; }
          # line=matrix-stack: the build base plus the carried Matrix stack, applied in id order by patches/stack.sh
          stack(){ local j; for attempt in 1 2; do j="$(bash patches/stack.sh --build ergo-matrix | tail -1)" && [ -f "$j" ] && { echo "$j"; return 0; }; echo "stack build failed (attempt $attempt)" >&2; sleep 20; done; return 1; }
          put(){ cp "$2" "jars/$1.jar"; cp "$2.json" "jars/$1.jar.json"; if [ -f "$2.stack.json" ]; then cp "$2.stack.json" "jars/$1.stack.json"; fi; }
          stacked(){ jq -r '"\([.patches[] | .id + (if .upstream_pr then " #\(.upstream_pr)" else "" end)] | join(", ")) (combined diff sha256 \(.combined_sha256))"' "jars/$1.stack.json"; }
          if [ "$LINE" = matrix-stack ]; then put base "$(stack)"; echo "base: build base + Matrix stack $(stacked base)" >> summary.txt
          else put base "$(build "$BASE")"; fi
          if [ "$AA" != true ]; then
            bash diffrun/build.sh --dry-run "$BASE" "$RANGE" -- "${PATHS[@]}" > jars/candidate.patch 2> dry.txt || { cat dry.txt; exit 1; }
            { echo "candidate patch ($RANGE, ${PATHS[*]}): sha256 $(sha256sum jars/candidate.patch | cut -d' ' -f1)"; grep -E '^build: files' dry.txt; } >> summary.txt
            MB="$(grep -oE '^merge-base: [0-9a-f]+' summary.txt | cut -d' ' -f2)"
            if [ "$LINE" = matrix-stack ]; then
              # the PR's diff (the bytes above) as one more patch after the stack, through stack.sh's overlay: the two jars
              # differ only in it; a diff that does not apply on the stack fails here (stack.sh names the patch)
              ov="$RUNNER_TEMP/pr-overlay"; mkdir -p "$ov/ergo-matrix"; cp jars/candidate.patch "$ov/ergo-matrix/pr-$PR.patch"
              jq -n --arg f "pr-$PR.patch" --argjson pr "$PR" '{patches: [{id: "999", file: $f, title: "PR #\($pr) production diff", status: "proposed", upstream_pr: $pr}]}' > "$ov/ergo-matrix/patches.json"
              put candidate "$(PEERYARD_PATCHES_EXTRA="$ov" stack)"
              echo "candidate: build base $BSHA + Matrix stack + PR #$PR diff last: $(stacked candidate) (merge-base $MB, head $HEAD_SHA)" >> summary.txt
            else
              put candidate "$(build "$BASE" "$RANGE" -- "${PATHS[@]}")"
              echo "candidate: build base $BSHA + PR #$PR diff (merge-base $MB, head $HEAD_SHA)" >> summary.txt
            fi
          else
            echo "A/A control: the base jar in both roles" >> summary.txt
          fi
          { (cd jars && sha256sum ./*.jar); for s in jars/*.jar.json; do echo "$(basename "$s"): $(jq -c '{expected_app_version, source_sha, patch: .patch.sha256}' "$s")"; done; echo '```'; } >> summary.txt
          tee -a "$GITHUB_STEP_SUMMARY" < summary.txt; cp summary.txt jars/build-summary.txt
      - uses: actions/upload-artifact@v4
        with: { name: pr-scenario-jars, path: jars/, retention-days: 90 }

  run:
    needs: build
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.build.outputs.run_minutes) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - name: Host prerequisites
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo modprobe sch_netem
          sudo apt-get install -y -qq jq iproute2 >/dev/null
          unshare -Urmn true && echo "userns ok"
          { uname -r; nproc; free -m | head -2; } | tee host.txt
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/download-artifact@v4
        with: { name: pr-scenario-jars, path: jars }
      - name: Run the shard (pairs of base, candidate)
        env:
          K: ${{ matrix.shard }}
        run: |
          bash diffrun/scenario-env.sh "diffrun/scenarios/$SCENARIO.json" "$SCENARIO_ENV" || exit 1
          o="$RUNNER_TEMP/out/shard-$K"; cand="$PWD/jars/candidate.jar"; [ "$AA" = true ] && cand="$PWD/jars/base.jar"
          bash diffrun/run.sh "diffrun/scenarios/$SCENARIO.json" --base "$PWD/jars/base.jar" --candidate "$cand" -n "$PAIRS" --out "$o" || echo "run.sh exit $?"
          # the shard's outputs minus run_meta.json (local paths) and node data: pool.sh reads verdict.json and manifest.json
          u="upload/shard-$K"; mkdir -p "$u"; cp host.txt "$u/"
          for f in verdict.json table.txt manifest.json base.sidecar.json candidate.sidecar.json runs.jsonl; do cp "$o/$f" "$u/" 2>/dev/null || true; done
          for r in "$o"/runs/*/; do t="$u/runs/$(basename "$r")"; mkdir -p "$t"; cp "$r"/{metadata.json,result.json,stdout.txt,stderr.txt} "$t/" 2>/dev/null || true; done
          if [ -f "$u/table.txt" ]; then tee -a "$GITHUB_STEP_SUMMARY" < "$u/table.txt"; else echo "shard $K: no verdict" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'shard-${{ matrix.shard }}', path: 'upload/shard-${{ matrix.shard }}/', retention-days: 90 }

  pool:
    needs: [build, run]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: 'shard-*', merge-multiple: false }
      - name: One verdict over the shards
        run: |
          mkdir -p art
          bash diffrun/pool.sh --out pooled --shards "$SHARDS" --pairs "$PAIRS" art; rc=$?
          { echo '```'; cat pooled/table.txt 2>/dev/null || echo "pool.sh exit $rc: no verdict"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pr-scenario-pooled, path: pooled/, retention-days: 90 }
