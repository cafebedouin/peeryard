# The review-queue pages (cafebedouin.github.io/peeryard and /maintainers): rendered daily from public GitHub data by
# queue/build.py under queue/rules.json, and deployed to GitHub Pages. No node runs, no secrets beyond the workflow
# token. Hand-maintained (not exported from anywhere).
name: review queue
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'queue/**', 'patches/**/patches.json', '.github/workflows/queue.yml' ]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Render the pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 queue/build.py --out site
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
