# Run ergo test specs on the weak-blocks line with each of several patches applied, on GitHub-hosted runners (a
# development machine discovers; the runs a claim rests on are made where anyone can re-run them). Each patch is
# applied alone to the base commit peeryard carries (patches/ergo-matrix/patches.json); each spec runs in its own job,
# `repeats` times, so a flaky test shows as a rate rather than a single red. Each job keeps its sbt log (gzipped; over 20 MB, its first and last 10 MB) and the
# scalatest XML report. Runs by hand. matrix_base (opt-in): a full weak-blocks commit to use instead of patches.json's
# base (empty = that base, as before); patches must be diffs from the base they are applied to. The arm `base` is the
# base alone (no patch), the control. tree.txt, in every job's artifact, names the base and the patch used.
# Mutation arms (opt-in): a patch from patches/mutate.sh is one more arm; with judge_mutant (that patch) and judge_test
# (a test name, or a part of it) set, a last job reads every job's report and prints diag/mutation_judge.py's verdict:
# KILLED when the control arm (judge_control, default base) passes in every job and the mutant fails in every job.
name: peeryard spec compare
run-name: "spec compare: ${{ inputs.specs }} x${{ inputs.repeats }} (${{ inputs.patches }})${{ inputs.matrix_base && format(' on {0}', inputs.matrix_base) || '' }}"
on:
  workflow_dispatch:
    inputs:
      patches: { description: 'space-separated patch files (repo paths), each applied alone to the weak-blocks base; the word base = the base alone (control)' }
      specs: { description: 'space-separated test classes (org.ergoplatform.mining.CandidateGeneratorSpec ...)' }
      repeats: { description: 'runs per patch and spec (1-5)', default: '2' }
      matrix_base: { description: 'full 40-hex weak-blocks commit to apply the patches to (empty = patches/ergo-matrix/patches.json base, as before)', default: '' }
      judge_mutant: { description: 'mutation arm to judge (one of the patches; empty = no judge job)', default: '' }
      judge_test: { description: 'the test the mutation must make fail (its name or a part of it)', default: '' }
      judge_control: { description: 'the arm that must pass (base, or one of the patches)', default: 'base' }
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      arms: ${{ steps.p.outputs.arms }}
      specs: ${{ steps.p.outputs.specs }}
      repeats: ${{ steps.p.outputs.repeats }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env: { PATCHES: '${{ inputs.patches }}', SPECS: '${{ inputs.specs }}', REPEATS: '${{ inputs.repeats }}', MATRIX_BASE: '${{ inputs.matrix_base }}' }
        run: |
          [[ "$REPEATS" =~ ^[1-5]$ ]] || { echo "repeats: 1-5"; exit 1; }
          [[ -z "$MATRIX_BASE" || "$MATRIX_BASE" =~ ^[0-9a-f]{40}$ ]] || { echo "matrix_base: empty, or a full 40-hex commit"; exit 1; }
          for p in $PATCHES; do [[ "$p" == base || ( "$p" =~ ^patches/[A-Za-z0-9/._-]+\.patch$ && -f "$p" ) ]] || { echo "patch: $p"; exit 1; }; done
          for s in $SPECS; do [[ "$s" =~ ^([A-Za-z][A-Za-z0-9]*/)?org\.ergoplatform\.[A-Za-z0-9.]+Spec[A-Za-z]*$ ]] || { echo "spec: $s"; exit 1; }; done
          echo "arms=$(printf '%s\n' $PATCHES | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "specs=$(printf '%s\n' $SPECS | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "repeats=$(seq 1 "$REPEATS" | jq -sc .)" >> "$GITHUB_OUTPUT"

  spec:
    needs: plan
    name: ${{ matrix.spec }} / ${{ matrix.patch }} / ${{ matrix.repeat }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        patch: ${{ fromJSON(needs.plan.outputs.arms) }}
        spec: ${{ fromJSON(needs.plan.outputs.specs) }}
        repeat: ${{ fromJSON(needs.plan.outputs.repeats) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: sbt/setup-sbt@v1
      - name: Cache the sigma-state snapshot the weak-blocks line depends on
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.scorexfoundation
          key: sigma-snapshot-${{ hashFiles('patches/ergo-matrix/patches.json', 'patches/sigma-snapshot.sh') }}${{ inputs.matrix_base && format('-{0}', inputs.matrix_base) || '' }}
      - name: Cache coursier
        uses: actions/cache@v4
        with:
          path: ~/.cache/coursier
          key: coursier-weak-blocks-${{ hashFiles('patches/ergo-matrix/patches.json') }}${{ inputs.matrix_base && format('-{0}', inputs.matrix_base) || '' }}
      - name: ergo at the weak-blocks base, the patch applied
        env: { PATCH: '${{ matrix.patch }}', MATRIX_BASE: '${{ inputs.matrix_base }}' }
        run: |
          base="${MATRIX_BASE:-$(jq -r .base patches/ergo-matrix/patches.json)}"
          src=patches.json; [ -n "$MATRIX_BASE" ] && src="matrix_base input"
          git clone -q --filter=blob:none https://github.com/ergoplatform/ergo "$HOME/ergo-clone"
          git -C "$HOME/ergo-clone" fetch -q origin weak-blocks
          git -C "$HOME/ergo-clone" cat-file -e "$base^{commit}" 2>/dev/null || git -C "$HOME/ergo-clone" fetch -q origin "$base"
          export DIFFRUN_ERGO_CLONE="$HOME/ergo-clone" JAVA8_HOME="$JAVA_HOME"
          bash patches/sigma-snapshot.sh "$base"
          git -C "$HOME/ergo-clone" checkout -q --detach "$base"
          if [ "$PATCH" = base ]; then pline="patch none (the base alone)"
          else git -C "$HOME/ergo-clone" apply --index "$GITHUB_WORKSPACE/$PATCH"; pline="patch $PATCH sha256 $(sha256sum "$PATCH" | cut -c1-16)"; fi
          { echo "base $base ($src)"; echo "$pline"; } | tee tree.txt
      - name: Run the spec
        env: { SPEC: '${{ matrix.spec }}' }
        run: |
          out="$GITHUB_WORKSPACE/out"; mkdir -p "$out"; cp tree.txt "$out/"
          cd "$HOME/ergo-clone"
          # a spec may be project-qualified, e.g. ergoCore/org.ergoplatform.mining.SomeSpec (subproject tests)
          if [[ "$SPEC" == */* ]]; then proj="${SPEC%%/*}"; cls="${SPEC#*/}"; cmd="$proj/testOnly $cls"; else cmd="testOnly $SPEC"; fi
          sbt -Denv=test ++2.12.20 "$cmd" > "$out/sbt.log" 2>&1 && echo "rc 0" > "$out/rc.txt" || echo "rc $?" > "$out/rc.txt"
          cp target/test-reports/*.xml "$out/" 2>/dev/null || true
          find . -path '*/target/test-reports/*.xml' -not -path './target/*' -exec cp {} "$out/" \; 2>/dev/null || true
          sed 's/\x1b\[[0-9;]*m//g' "$out/sbt.log" | grep -E '^\[info\] - |Tests: ' | tee -a "$GITHUB_STEP_SUMMARY"
          # keep the artifact small: a runaway test can write gigabytes of log. Over 20 MB, keep the first and last
          # 10 MB (the cut is marked); then gzip it (sbt.log.gz)
          sz=$(stat -c %s "$out/sbt.log")
          if [ "$sz" -gt 20971520 ]; then
            { head -c 10485760 "$out/sbt.log"; printf '\n[... %s bytes cut by the workflow: first and last 10 MB kept ...]\n' "$((sz - 20971520))"; tail -c 10485760 "$out/sbt.log"; } > "$out/sbt.log.cut"
            mv "$out/sbt.log.cut" "$out/sbt.log"; fi
          gzip -9 "$out/sbt.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spec-${{ strategy.job-index }}
          path: out/
          retention-days: 30

  judge:
    needs: spec
    if: always() && inputs.judge_mutant != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: art, pattern: 'spec-*' }
      - name: Mutation verdict
        env: { MUTANT: '${{ inputs.judge_mutant }}', TEST: '${{ inputs.judge_test }}', CONTROL: '${{ inputs.judge_control }}' }
        run: |
          [[ -n "$TEST" ]] || { echo "judge_test: the test name"; exit 1; }
          rc=0; python3 diag/mutation_judge.py art --test "$TEST" --mutant "$MUTANT" --control "$CONTROL" > judge.txt || rc=$?
          { echo '```'; cat judge.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; cat judge.txt
          echo "judge exit $rc (0 KILLED, 1 SURVIVED, 3 INVALID)"
      - uses: actions/upload-artifact@v4
        with: { name: mutation-judge, path: judge.txt, retention-days: 90 }
