# Run one of ergo's own unit specs (or one test in it) N times on a given commit, on GitHub-hosted runners: the way to put
# a number on a flaky test before and after a change, on the runner class upstream's CI uses. Each run is a fresh sbt
# process with upstream CI's command line (`sbt -Denv=test "testOnly <spec> -- -z <filter>"`, JDK 8); the build forks a
# test JVM per run. An optional patch (a unified diff, base64) is applied first, e.g. a one-line delay that makes a race
# certain; the patch and its sha256 are printed in the summary so a re-run uses the same bytes. Runs by hand.
#
#   gh workflow run spec-loop.yml -f sha=<ergo commit> -f spec=org.ergoplatform.mining.CandidateGeneratorSpec \
#     -f filter='ignore cached candidate when forced = true' -f repeats=20 [-f patch_b64="$(base64 -w0 x.patch)"] -f label=pr-stress
name: spec loop
run-name: "spec loop ${{ inputs.label }}: ${{ inputs.spec }} x${{ inputs.repeats }} @ ${{ inputs.sha }}"
on:
  workflow_dispatch:
    inputs:
      sha: { description: 'ergoplatform/ergo commit (full sha; a pull request head is fine)', required: true }
      spec: { description: 'spec class for testOnly', required: true }
      filter: { description: 'optional test-name substring (ScalaTest -z)', default: '' }
      repeats: { description: 'runs (1-30)', default: '10' }
      patch_b64: { description: 'optional unified diff to apply first, base64', default: '' }
      label: { description: 'short arm label for the run name and results', default: 'arm' }
permissions:
  contents: read
jobs:
  loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: sbt/setup-sbt@v1
      - name: Check the inputs
        env: { SHA: '${{ inputs.sha }}', SPEC: '${{ inputs.spec }}', REPEATS: '${{ inputs.repeats }}', LABEL: '${{ inputs.label }}' }
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha: a full 40-hex commit"; exit 1; }
          [[ "$SPEC" =~ ^[A-Za-z0-9_.]+$ ]] || { echo "spec: a class name"; exit 1; }
          [[ "$REPEATS" =~ ^([1-9]|[12][0-9]|30)$ ]] || { echo "repeats: 1-30"; exit 1; }
          [[ "$LABEL" =~ ^[A-Za-z0-9._-]{1,40}$ ]] || { echo "label: [A-Za-z0-9._-]{1,40}"; exit 1; }
      - name: ergo at the commit (any ref, pull request heads included)
        env: { SHA: '${{ inputs.sha }}' }
        run: |
          git init -q ergo && cd ergo && git remote add origin https://github.com/ergoplatform/ergo
          git fetch -q --depth 1 origin "$SHA" || git fetch -q origin '+refs/pull/*/head:refs/remotes/pr/*' '+refs/heads/*:refs/remotes/origin/*'
          git checkout -q --detach "$SHA"; echo "ergo: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply the patch
        if: inputs.patch_b64 != ''
        env: { PATCH_B64: '${{ inputs.patch_b64 }}' }
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > "$RUNNER_TEMP/input.patch"
          git -C ergo apply --verbose "$RUNNER_TEMP/input.patch"
          { echo "patch sha256: $(sha256sum "$RUNNER_TEMP/input.patch" | cut -c1-64)"; echo '```diff'; cat "$RUNNER_TEMP/input.patch"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.cache/coursier/v1
          key: spec-loop-sbt-${{ hashFiles('ergo/**/*.sbt', 'ergo/project/build.properties') }}
      - name: Compile the tests once
        run: cd ergo && sbt -Denv=test Test/compile > "$RUNNER_TEMP/compile.log" 2>&1 || { tail -50 "$RUNNER_TEMP/compile.log"; exit 1; }
      - name: Loop
        env: { SPEC: '${{ inputs.spec }}', FILTER: '${{ inputs.filter }}', REPEATS: '${{ inputs.repeats }}', LABEL: '${{ inputs.label }}' }
        run: |
          mkdir -p out; printf 'arm\trun\texit\ttests\tfirst_failure\n' > out/RESULTS.tsv
          cmd="testOnly $SPEC"; [[ -n "$FILTER" ]] && cmd="$cmd -- -z \"$FILTER\""
          echo "command: sbt -Denv=test '$cmd'" | tee -a "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 "$REPEATS"); do
            log="out/run-$i.log"; rc=0; ( cd ergo && sbt -Denv=test "$cmd" ) > "$log" 2>&1 || rc=$?   # the step runs under bash -e
            sed -i 's/\x1b\[[0-9;]*m//g' "$log"
            tests="$(grep -o 'Tests: succeeded [0-9]*, failed [0-9]*' "$log" | tail -1 || true)"
            fail="$(grep -A1 -m1 '\*\*\* FAILED \*\*\*' "$log" | tail -1 | sed 's/^\[info\] *//' | cut -c1-240 | tr '\t' ' ' || true)"
            printf '%s\t%s\t%s\t%s\t%s\n' "$LABEL" "$i" "$rc" "${tests:-none}" "$fail" | tee -a out/RESULTS.tsv
          done
          pass=$(awk -F'\t' 'NR>1 && $4=="Tests: succeeded 1, failed 0"' out/RESULTS.tsv | wc -l)
          fail=$(awk -F'\t' 'NR>1 && $4=="Tests: succeeded 0, failed 1"' out/RESULTS.tsv | wc -l)
          other=$(( REPEATS - pass - fail ))
          { echo "**$LABEL: $pass passed, $fail failed, $other other (of $REPEATS)**"; echo '```'; cat out/RESULTS.tsv; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'spec-loop-${{ inputs.label }}', path: out/, retention-days: 30 }
